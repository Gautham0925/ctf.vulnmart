worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  client_max_body_size 64k;
  access_log off;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/cb; proxy_temp_path /tmp/pt; fastcgi_temp_path /tmp/ft; uwsgi_temp_path /tmp/ut; scgi_temp_path /tmp/st;
  gzip on;
  gzip_types text/css application/javascript application/json;
  upstream shop_api { server 127.0.0.1:8000; keepalive 32; }
  server {
    listen __PORT__;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    location ~ ^/(api|legacy|promo)/ {
      proxy_pass http://shop_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_connect_timeout 3s;
      proxy_read_timeout 25s;
    }
    location /img/ { expires 7d; }
    location / { try_files $uri /index.html; }
  }
}
